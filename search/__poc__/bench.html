<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model Explorer — search POC bench</title>
<!-- Internal POC harness, but still part of the site: it links the one shared stylesheet so it cannot
     drift from the site tokens (it used to hand-roll three literal colours of its own). -->
<link rel="stylesheet" href="../../public/styles.css" />
<style>
  body { font: 14px/1.5 var(--font-body); margin: 1.5rem; max-width: 60rem; background: var(--background); color: var(--color); }
  h1 { font-size: 1.2rem; font-family: var(--font-display); }
  pre { background: var(--bg-secondary); padding: 1rem; border-radius: var(--radius); overflow-x: auto; }
  #status { font-weight: 600; }
  .ok { color: var(--good); }
  .bad { color: var(--bad); }
</style>
</head>
<h1>Client-side model explorer — search POC bench</h1>
<p id="status" role="status" aria-live="polite">starting…</p>
<pre id="out">running…</pre>
<script type="module" src="./bench.js"></script>
</body>
</html>
