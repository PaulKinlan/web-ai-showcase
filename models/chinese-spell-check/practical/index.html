<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>中文错别字 Practical — 文档扫描 · Web AI Showcase</title>
    <meta name="description" content="Paste a paragraph; get every homophone correction in one pass — the content-QA pattern for posts, docs, and search queries." />
    <link rel="stylesheet" href="/web-ai-showcase/public/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🀄</text></svg>" />
  </head>
  <body>
    <p class="crumbs"><a href="/web-ai-showcase/">← All models</a> · <a href="../">中文错别字</a></p>
    <header>
      <p class="eyebrow">use case · practical</p>
      <h1>Practical: 文档扫描</h1>
      <p class="lede">Paste a paragraph; get every homophone correction in one pass — the content-QA pattern for posts, docs, and search queries.</p>
    </header>
    <section class="panel">
      <div id="model-loader"></div>
      <p class="status" id="status" role="status" aria-live="polite" hidden></p>
      <label style="display:flex;flex-direction:column;gap:.25rem;font-size:.82rem;margin-top:.6rem">中文句子
        <textarea id="prompt" class="prompt" disabled spellcheck="false">今天天汽很好，我想去公圆散步。他问我要不要去一家新开的歺厅。</textarea>
      </label>
      <div class="sample-row" id="samples"><button class="chip" type="button" data-t="今天天汽很好，我想去公圆散步。他问我要不要去一家新开的歺厅。">段落一</button><button class="chip" type="button" data-t="请把作页交给老师，然后认真检査一遍答案。">段落二</button><button class="chip" type="button" data-t="这个故事情节很精采，结局让人意想不到。">段落三</button></div>
      <div class="controls"><button id="run" type="button" disabled>检查错别字</button></div>
      <div class="gen-out" id="out" aria-live="polite"><span class="muted">修正后的句子会显示在这里。</span></div>
      <p class="eyebrow" id="changesLabel" hidden>改动明细</p>
      <div class="changes" id="changes"></div>
      <div class="readout" id="readout" hidden>
        <span>backend <b id="rBackend">–</b></span>
        <span>fixes <b id="rFixes">–</b></span>
        <span>total time <b id="rMs">–</b></span>
      </div>
    </section>
    <p class="muted" style="font-size:.85rem">批量扫描的 demo：整段一次前向，逐字修正。适合粘贴自己的文字测试。</p>
    <p class="crumbs"><a href="../">← 返回</a></p>
    <script type="module">
      import { CscEngine, CSC_CSS } from "../csc.js";
      import { createModelLoader } from "/web-ai-showcase/lib/model-loader.js";
      const style = document.createElement("style"); style.textContent = CSC_CSS; document.head.append(style);
      const $ = (id) => document.getElementById(id);
      const engine = new CscEngine();
      for (const c of $("samples").children) c.addEventListener("click", () => { $("prompt").value = c.dataset.t; });
      createModelLoader({
        mount: $("model-loader"),
        model: { modelId: "shibing624/macbert4csc-base-chinese", runtime: "transformers.js", dtype: "fp32", sizeMB: 474, requiresWebGPU: false },
        load: async (onProgress) => { await engine.load(onProgress); return engine; },
        onReady: () => { $("run").disabled = false; $("prompt").disabled = false; },
      });
      $("run").addEventListener("click", async () => {
        const text = $("prompt").value;
        if (!text.trim()) return;
        $("run").disabled = true; $("status").hidden = false; $("status").classList.remove("err","ok"); $("status").textContent = "检查中…";
        try {
          const r = await engine.correct(text);
          $("out").textContent = r.corrected;
          $("changesLabel").hidden = false;
          $("changes").replaceChildren(...r.changes.map((c, i) => {
            const div = document.createElement("div"); div.className = "c";
            div.innerHTML = `<span class="idx">#${i + 1}</span> <span class="from">${c.from}</span> → <span class="to">${c.to}</span> <span class="conf">p=${(r.confidences[c.pos] ?? 0).toFixed(2)}</span>`;
            return div;
          }));
          if (r.changes.length === 0) $("changes").innerHTML = '<div class="c"><span class="muted">未发现改动。</span></div>';
          $("readout").hidden = false;
          $("rBackend").textContent = r.device.toUpperCase();
          $("rFixes").textContent = r.changes.length;
          $("rMs").textContent = r.ms + " ms";
          $("status").textContent = "完成。"; $("status").classList.add("ok");
        } catch (err) { $("status").textContent = "检查失败: " + err.message; $("status").classList.add("err"); }
        finally { $("run").disabled = false; }
      });
    </script>
  </body>
</html>
