name: gates

# Durable-demo route gate + immutable-conformance/parity gate + artifact schema validation.
# These are the same gates the routine runs before every push (see AGENTS.md / CLAUDE.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The adversarial runtime-pin tier (below) runs ONLY on this daily schedule and on manual
  # dispatch (bead web-ai-showcase-ehf): ~60+ isolated-copy mutation gate runs, ~7 minutes —
  # too heavy for every push/PR, but its scheduled result is the durable proof the gate still
  # catches every bad-pin class. The regular gate jobs below are unchanged by the schedule
  # trigger: they carry an event_name guard so pushes/PRs never queue the heavy tier.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  gate:
    # Skip the regular gate jobs on scheduled/dispatch runs — those events exist for the
    # adversarial tier alone (pushes already run everything below on main).
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the gates diff against origin/main for baselines
      - name: Ensure origin/main is available for baseline diffs
        run: git fetch origin main --depth=1 || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Install BEFORE any static gate step (bead web-ai-showcase-tdbr): the Currency & runtime
      # pin gate itself imports the pinned parser deps (acorn/acorn-walk/parse5) via the j9z module
      # graph (audit-model-currency -> runtime-pin-literals -> runtime-pin-parser), and
      # test/runtime-pin-parser.test.mjs (bead web-ai-showcase-j6i) needs them too. With the install
      # placed after the statics, every push run on a clean runner died at the Currency step with
      # ERR_MODULE_NOT_FOUND 'acorn' — CI sat red on main since ≥2026-10-09 while the same stages
      # passed on fleet VMs (node_modules always present via fleet-deps). Exact committed lockfile.
      - name: Install pinned parser dependencies (exact lockfile)
        run: npm ci --ignore-scripts
      - name: Route regression gate (durable-demo contract)
        run: node scripts/check-routes.mjs
      - name: Conformance + parity gate (immutable suites, schema, coverage)
        run: node scripts/check-conformance.mjs
      - name: Lineage gate (identity preservation, dup/quant/port reproducibility, no-collapse)
        run: node scripts/check-lineage.mjs
      - name: "Image provenance gate (fail-closed: every image ledgered; no unverified faces ship)"
        run: node scripts/check-image-provenance.mjs
      - name: "Audio provenance gate (fail-closed: every bundled audio file has a recorded provenance entry)"
        run: node scripts/check-audio-provenance.mjs
      - name: Download-route inventory gate (every downloading route classified; matches source)
        run: node scripts/check-download-inventory.mjs
      - name: Download-component adoption gate (no downloading route bypasses <model-download-status>)
        run: node scripts/check-download-adoption.mjs
      - name: Ladder-link gate (every advertised in-family link on a built route resolves)
        run: node scripts/check-ladder-links.mjs
      - name: Currency & runtime pin gate (detects unauthorized runtime pins and catalogue drift)
        run: node scripts/audit-model-currency.mjs --check
      # The whole node suite, not a hand-picked file. Until web-ai-showcase-i0h this step did not
      # exist at all: the tests were written, committed, and never executed by CI, so two of them
      # sat red on main indefinitely. A suite nothing runs is documentation, not enforcement.
      #
      # Note the glob is quoted. `node --test test/` makes Node 24 resolve test/ as a MODULE path
      # and die with ERR_MODULE_NOT_FOUND, which reads exactly like a suite failure and is easy to
      # misdiagnose as a regression.
      - name: Node test suite (fixtures, gate rules, reducers — no browser, no network)
        run: node --test "test/**/*.test.mjs"
      # The Deno server suite (`deno task test:server` → `deno test server_test.ts`), which covers the
      # same-origin proxy/redirect invariants. CI never ran it before web-ai-showcase-ffu: gate.yml
      # drove the node suite only, so the load-bearing security tests web-ai-showcase-vq7 added to
      # server_test.ts were enforced by human-run gates alone. A suite nothing runs is documentation,
      # not enforcement — the same trap the node-suite step above calls out.
      #
      # Declared dependency: unlike Node.js, `deno` is NOT preinstalled on ubuntu-latest (the runner
      # image's Language and Runtime list has Node.js/Python/Go/Rust/Java/.NET — no Deno), so without
      # this setup action the step below dies on "deno: command not found". ~1s, no browser.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno server test suite (same-origin proxy/redirect invariants — no browser, no network)
        run: deno task test:server
      # Declared dependency: this step needs Chrome. ubuntu-latest normally ships it; the preflight
      # turns a missing browser into a NAMED dependency error instead of five spawn-ENOENT failures
      # behind a retry storm, and the test itself skips with a stated reason when no browser resolves.
      - name: Browser-driven viewport test (needs Chrome · ~50s · test-browser/)
        run: |
          # A verified CHROME_BIN counts as declaring the dependency, matching the harness: it accepts a
          # CHROME_BIN that points at a runnable file and ignores one that does not (web-ai-showcase-fdy).
          { [ -n "${CHROME_BIN:-}" ] && [ -x "${CHROME_BIN}" ]; } || command -v google-chrome-stable >/dev/null 2>&1 || command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1 || { echo "::error::No Chrome/Chromium found on PATH or in CHROME_BIN — this step declares a browser dependency"; exit 1; }
          node --test test-browser/mobile-viewport.test.mjs test-browser/example-gallery-attribution.test.mjs test-browser/image-credit-hostile.test.mjs test-browser/chrome-navigation.test.mjs test-browser/static-server-paths.test.mjs

  # Scheduled heavy tier (bead web-ai-showcase-ehf): the runtime-pin ADVERSARIAL suite — every
  # mutation proof that the currency gate catches bad pins (MUTANT PROOF / STRICT RAW / FLOATING /
  # LITERAL BOUNDARY / LEDGER tampering / vs2 falsification). ~60+ isolated-copy gate runs, ~7 min,
  # no browser, no network. It lives in test-adversarial/ (outside the default node --test glob, the
  # same layout as test-browser/) so per-push CI stays fast; this daily job is its durable result —
  # the check-run record on main IS the audit trail. Run ad hoc with `deno task test:adversarial`.
  adversarial-runtime-pins:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The adversarial suite materialises its isolated copy via `git archive HEAD` and symlinks the
      # repo's node_modules into it (test/lib/isolated-repo.mjs); the literal pass parses with the
      # pinned acorn/parse5 deps, so install the exact lockfile first (same as the node-suite step).
      - name: Install pinned parser dependencies (exact lockfile)
        run: npm ci --ignore-scripts
      - name: Runtime-pin adversarial suite (mutation proofs · ~7 min · no browser, no network)
        run: node --test test-adversarial/runtime-pins-adversarial.test.mjs
