name: gates

# Durable-demo route gate + immutable-conformance/parity gate + artifact schema validation.
# These are the same gates the routine runs before every push (see AGENTS.md / CLAUDE.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the gates diff against origin/main for baselines
      - name: Ensure origin/main is available for baseline diffs
        run: git fetch origin main --depth=1 || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Route regression gate (durable-demo contract)
        run: node scripts/check-routes.mjs
      - name: Conformance + parity gate (immutable suites, schema, coverage)
        run: node scripts/check-conformance.mjs
      - name: Lineage gate (identity preservation, dup/quant/port reproducibility, no-collapse)
        run: node scripts/check-lineage.mjs
      - name: "Image provenance gate (fail-closed: every image ledgered; no unverified faces ship)"
        run: node scripts/check-image-provenance.mjs
      - name: Download-route inventory gate (every downloading route classified; matches source)
        run: node scripts/check-download-inventory.mjs
      - name: Download-component adoption gate (no downloading route bypasses <model-download-status>)
        run: node scripts/check-download-adoption.mjs
      - name: Ladder-link gate (every advertised in-family link on a built route resolves)
        run: node scripts/check-ladder-links.mjs
      - name: Currency & runtime pin gate (detects unauthorized runtime pins and catalogue drift)
        run: node scripts/audit-model-currency.mjs --check
      # The whole node suite, not a hand-picked file. Until web-ai-showcase-i0h this step did not
      # exist at all: the tests were written, committed, and never executed by CI, so two of them
      # sat red on main indefinitely. A suite nothing runs is documentation, not enforcement.
      #
      # Note the glob is quoted. `node --test test/` makes Node 24 resolve test/ as a MODULE path
      # and die with ERR_MODULE_NOT_FOUND, which reads exactly like a suite failure and is easy to
      # misdiagnose as a regression.
      - name: Node test suite (fixtures, gate rules, reducers — no browser, no network)
        run: node --test "test/**/*.test.mjs"
      # Declared dependency: this step needs Chrome. ubuntu-latest normally ships it; the preflight
      # turns a missing browser into a NAMED dependency error instead of five spawn-ENOENT failures
      # behind a retry storm, and the test itself skips with a stated reason when no browser resolves.
      - name: Browser-driven viewport test (needs Chrome · ~50s · test-browser/)
        run: |
          # A verified CHROME_BIN counts as declaring the dependency, matching the harness: it accepts a
          # CHROME_BIN that points at a runnable file and ignores one that does not (web-ai-showcase-fdy).
          { [ -n "${CHROME_BIN:-}" ] && [ -x "${CHROME_BIN}" ]; } || command -v google-chrome-stable >/dev/null 2>&1 || command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1 || { echo "::error::No Chrome/Chromium found on PATH or in CHROME_BIN — this step declares a browser dependency"; exit 1; }
          node --test test-browser/mobile-viewport.test.mjs
